[project]
name = "sih26145-detector"
version = "0.1.0"
description = "Read-only streaming cyber-threat detection prototype for SIH26145"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9",
  "httpx>=0.27,<1",
  "appwrite>=9,<12"
]
appwrite = [
  "appwrite>=9,<12"
]
ml = [
  "scikit-learn>=1.4,<2"
]
data = [
  "pandas>=2.2,<3"
]
live = [
  "scapy>=2.5,<3"
]

[project.scripts]
sih26145-api = "sih_detector.api:run"
sih26145-replay = "sih_detector.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
